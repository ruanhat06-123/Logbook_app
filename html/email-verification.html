<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email verified · LogMate</title>
    <link rel="icon" type="image/svg+xml" href="../logo.svg" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#3A4A66" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <section class="auth-intro">
        <div class="brand"><img class="brand-mark" src="../logo.svg" alt="" /> LogMate</div>
        <div class="auth-copy">
          <div class="auth-tag">Account confirmation</div>
          <h1>Ready for<br />the road.</h1>
          <p>Your email keeps your LogMate account secure.</p>
        </div>
        <div class="auth-tag">EST. 2026 / LogMate</div>
      </section>
      <section class="auth-form-side">
        <div class="auth-box">
          <div class="eyebrow">Email verification</div>
          <h2 id="verification-title">Verifying your email...</h2>
          <p id="verification-message">Please wait while we confirm your LogMate account.</p>
          <div class="notice" id="verification-notice" hidden></div>
          <a class="btn btn-primary" id="verification-action" href="/html/login.html" hidden>Continue to LogMate →</a>
        </div>
      </section>
    </div>
    <script type="module" src="../js/emailVerification.js"></script>
  </body>
</html>
