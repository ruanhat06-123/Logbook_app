<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password · LogMate</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <section class="auth-intro">
        <div class="brand"><span class="brand-mark">↗</span> LogMate</div>
        <div class="auth-copy">
          <div class="auth-tag">Account recovery</div>
          <h1>Back on<br />the road.</h1>
          <p>Choose a new password for your LogMate account.</p>
        </div>
        <div class="auth-tag">EST. 2026 / LogMate</div>
      </section>
      <section class="auth-form-side">
        <div class="auth-box">
          <div class="eyebrow">Password reset</div>
          <h2>Set a new password</h2>
          <p>Use at least 8 characters, including an uppercase letter, a lowercase letter, and a number.</p>
          <form id="reset-form">
            <div class="field">
              <label for="reset-email">Email address</label>
              <input id="reset-email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="new-password">New password</label>
              <div class="password-field">
                <input id="new-password" type="password" minlength="8" autocomplete="new-password" required />
                <button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show new password">Show</button>
              </div>
            </div>
            <div class="field">
              <label for="confirm-password">Confirm new password</label>
              <div class="password-field">
                <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required />
                <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password confirmation">Show</button>
              </div>
            </div>
            <button class="btn btn-primary" type="submit" id="reset-button">Update password →</button>
          </form>
          <div class="notice" id="reset-notice" hidden></div>
        </div>
      </section>
    </div>
    <script type="module" src="../js/resetPassword.js"></script>
  </body>
</html>
