<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mileage / Log</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="auth-page"><section class="auth-intro"><div class="brand"><span class="brand-mark">↗</span> mileage / log</div><div class="auth-copy"><div class="auth-tag">A clearer road ahead</div><h1>Your car,<br>in context.</h1><p>Keep every fill-up, every kilometre, and the bigger picture in one quiet place.</p></div><div class="auth-tag">EST. 2026 / NAIROBI</div></section><section class="auth-form-side"><div class="auth-box"><div class="eyebrow">Welcome back</div><h2 id="form-title">Sign in to your logbook</h2><p id="form-description">Your driving data, ready when you are.</p><form id="auth-form"><div class="form-grid auth-name-fields" id="name-fields" hidden><div class="field"><label for="first-name">First name</label><input id="first-name" type="text" placeholder="Alex" autocomplete="given-name"></div><div class="field"><label for="surname">Surname</label><input id="surname" type="text" placeholder="Mwangi" autocomplete="family-name"></div></div><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="password-field"><input id="password" type="password" placeholder="••••••••" minlength="6" autocomplete="current-password" required><button type="button" class="password-toggle" id="password-toggle" aria-controls="password" aria-label="Show password">Show</button></div></div><button class="btn btn-primary" type="submit" id="submit-button">Sign in →</button></form><div class="auth-switch"><span id="switch-copy">New here?</span> <button type="button" id="switch-mode">Create an account</button></div><div class="notice" id="auth-notice" hidden></div></div></section></div><script type="module"
